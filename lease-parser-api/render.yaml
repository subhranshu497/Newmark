services:
  - type: web
    name: lease-abstraction-api
    runtime: python
    plan: free
    rootDir: lease-parser-api
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: >-
      python -c "import asyncio; from src.models.db import create_all; asyncio.run(create_all())" &&
      uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LEASE_ABSTRACTION_DATABASE_URL
        value: sqlite+aiosqlite:///./local_demo.db
      - key: LEASE_ABSTRACTION_ENABLE_DEMO_UI
        value: "1"
      - key: LEASE_ABSTRACTION_ANTHROPIC_API_KEY
        sync: false
      - key: LEASE_ABSTRACTION_OPENAI_API_KEY
        sync: false
